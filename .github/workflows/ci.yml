name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Manifest
        run: bash tests/check-manifest.sh

      - name: Unit tests (panel logic, JavaScript)
        run: node tests/model.test.js

      - name: Unit tests (bridge helper, Python)
        run: python3 -B -m unittest discover -s tests -v

      - name: Syntax
        run: |
          python3 -m py_compile helper/*.py tests/*.py
          bash -n tests/check-manifest.sh
